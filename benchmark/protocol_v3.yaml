# This file was created before any formal benchmark result existed.  It records
# design corrections found by the Phase 4.7 execution-readiness review.
pre_result_change_record:
  created_before_formal_result: true
  reason:
    - no common hardware trigger exists between EVK4 and Genesis
    - exact real x(t) and a synchronized real trajectory are unavailable
    - the previous local 5 ms windows were not defensible as formal units
    - real HDF5 readability, native Genesis HDR, and official V2E execution
      must be proven before any aggregate result is allowed
  forbidden_basis: no formal metric, ranking, or inspected formal result

