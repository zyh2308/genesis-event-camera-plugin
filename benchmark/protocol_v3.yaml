frozen_repository:
  repository: zyh2308/genesis-event-camera-plugin
  frozen_core_commit: e79e656ac00f7847b98db9e12bf43b093f3afff1
  core_path: genesis_event_plugin/
  core_modification_during_benchmark: forbidden
  core_integrity_check: "git diff --exit-code e79e656 -- genesis_event_plugin/"
  benchmark_harness_may_advance: true

execution_gate:
  phase: Phase_4_7_Formal_Execution_Readiness
  required_clean_worktree: true
  formal_result_creation: disabled
  formal_metrics_must_run: false
  human_phase5_approval_required: true
  runner_must_fail_closed: true
  required_checks:
    - protocol_v3_hash
    - pair_v3_hash
    - clean_git
    - frozen_core_diff_empty
    - real_LR_complete_CD_and_events_read
    - real_RL_complete_CD_and_events_read
    - real_timestamp_origin_smoke
    - Genesis_importable
    - Genesis_native_HDR_smoke
    - Ours_v3_1_actual_smoke
    - formal_replay_is_executable_and_non_placeholder
    - V2E_official_full_pipeline_smoke
    - full_direction_duration_match
    - CD_disabled
    - GD_disabled
    - temporal_offset_search_disabled
    - primary_metric_definitions_unchanged

time_origin:
  canonical_formula: "t_rel = t - declared_sequence_start"
  units: microseconds_for_event_streams_seconds_for_simulator_timestamps
  declared_sequence_start_priority:
    - acquisition_metadata
    - segment_metadata
    - format-defined local segment origin
  real_sequence_origin:
    source: segment_file_origin
    declared_start_us: 0
    evidence:
      - source/one_round/segment_01_LR.raw.tmp_index
      - source/one_round/segment_02_RL.raw.tmp_index
      - derived/one_round_h5/CD/indexes
    limitation: >-
      The vendor recording does not expose a hardware-trigger timestamp shared
      with Genesis. Events before/after the first decoded event are retained;
      the first event is never used as an alignment offset.
  method_alignment:
    per_method_offset_search: false
    first_event_alignment: false
    common_trigger_required_for_pixelwise_claim: true
  smoke_test: benchmark/scripts/real_timestamp_origin_smoke.py

data_policy:
  existing_assets_first: true
  fabricate_data: false
  post_result_source_switch: forbidden
  external_asset_root: /home/科研/Eventbased_WAM
  real_dynamic_source:
    LR: /home/科研/Eventbased_WAM/data/real/evk4_checkerboard_translation_20260914/derived/one_round_h5/segment_01_LR.hdf5
    RL: /home/科研/Eventbased_WAM/data/real/evk4_checkerboard_translation_20260914/derived/one_round_h5/segment_02_RL.hdf5
  real_loader:
    required_complete_datasets:
      - CD/events
    required_metadata:
      - format
      - geometry
      - serial_number
      - sequence_origin
    primary_source: official_vendor_HDF5_ECF
    fallback_policy:
      allowed: true
      activation: only_if_declared_before_formal_execution
      required_manifest_fields:
        - exact_decoded_path
        - source_RAW_path
        - conversion_command_or_script
        - converter_version
        - event_count_and_time_span_check
      current_status: not_activated

real_sequences:
  resolution_xy: [1280, 720]
  event_schema: "EVT3 HDF5 CD/events {x,y,p,t}; t in microseconds"
  trajectory_status: exact_real_x_of_t_unknown
  synchronization_status: no_common_hardware_trigger
  LR:
    file: /home/科研/Eventbased_WAM/data/real/evk4_checkerboard_translation_20260914/derived/one_round_h5/segment_01_LR.hdf5
    duration_s: 1.756258
    declared_direction: LR
  RL:
    file: /home/科研/Eventbased_WAM/data/real/evk4_checkerboard_translation_20260914/derived/one_round_h5/segment_02_RL.hdf5
    duration_s: 1.775800
    declared_direction: RL

primary_evaluation:
  unit: full_direction_sequence
  directions: [LR, RL]
  same_duration_per_direction: true
  real_vs_ours_and_v2e: true
  interpretation: coarse_distributional_comparison_only
  exact_pixelwise_fidelity_claim: false
  metrics:
    - event_rate_relative_error
    - polarity_ratio_error
    - active_pixel_ratio_error
    - spatial_distribution_l1_8x8
  definitions:
    event_rate_relative_error: abs(rate_sim-rate_real)/max(rate_real, eps)
    polarity_ratio_error: abs(ON_ratio_sim-ON_ratio_real)
    active_pixel_ratio_error: abs(APR_sim-APR_real)
    spatial_distribution_l1_8x8: sum_i abs(p_sim_i-p_real_i)
  disabled:
    CD: no_common_trigger_and_exact_trajectory
    GD: no_common_trigger_and_exact_trajectory
    temporal_rate_error_per_5ms_bin: not_a_primary_unit_in_v3
    composite_score: forbidden
    ranking_score: forbidden
  qualitative_only:
    window_duration_s: 0.005
    normalized_fractions: [0.25, 0.50, 0.75]
    purpose: deterministic_qualitative_visualization_only
    allowed_in_formal_aggregate: false

