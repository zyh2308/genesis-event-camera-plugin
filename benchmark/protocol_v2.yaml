methods:
  ours_v3_1:
    label: Ours-v3.1-direct-real_v2
    implementation: frozen Genesis plugin at e79e656ac00f7847b98db9e12bf43b093f3afff1
    config: benchmark/configs/ours.yaml
    config_hash_source: benchmark/configs/CONFIG_HASHES.json
    preset: real_v2
    parameter_freeze: true
    formal_input_contract:
      radiance: scene-linear HDR/radiance
      depth: required
      segmentation: required
      camera_pose: required
      object_link_pose: required
      timestamps: required
    display_rgb_fallback: forbidden_for_formal_result
  v2e:
    label: V2E-official-core
    source: https://github.com/SensorsINI/v2e
    local_source: /home/科研/Eventbased_WAM/code/v2e_source
    version: 1.5.1
    config: benchmark/configs/v2e.yaml
    config_hash_source: benchmark/configs/CONFIG_HASHES.json
    parameter_freeze: true
    input_contract: official EventEmulator image-sequence input
    formal_input_cadence:
      source_frame_rate_hz: 100.0
      timestamp_resolution_s: 0.0001
      effective_cadence_hz: 10000.0
      auto_timestamp_resolution: false
      cutoff_hz: 300.0
      selection_reason: >-
        The official v2e_utils.check_lowpass() uses maxeps=0.3 for the IIR
        update. With tau=1/(2*pi*300 Hz), dt=0.0001 s gives eps=dt/tau
        approximately 0.1885, below the official warning threshold. The
        previous 100 Hz effective input gave eps approximately 18.8496 and
        triggered the documented numerical warning. This cadence is fixed
        before any formal output and is not a V2E parameter search.
      official_source_reference:
        file: /home/科研/Eventbased_WAM/code/v2e_source/v2ecore/v2e_utils.py
        function: check_lowpass
        maxeps: 0.3
      smoke_required_before_formal: true
  esim:
    label: ESIM
    source: https://github.com/uzh-rpg/rpg_esim
    status: supported_but_not_reproducibly_built
    formal_status: excluded_until_official_executable_smoke_passes
  icns_iebcs:
    label: ICNS/IEBCS
    source: https://github.com/neuromorphicsystems/IEBCS
    status: not_checked_out_locally
    formal_status: excluded

system_level_pairing:
  claim_boundary: >-
    Ours and V2E receive the same Genesis replay, camera resolution, crop,
    duration, and nominal motion definition. This is a system-level simulator
    comparison, not an isolated pixel-model comparison.
  shared:
    scene: benchmark/replays/checkerboard_translation_v2.yaml
    camera_resolution: [1280, 720]
    crop_xywh: [0, 0, 1280, 720]
    direction_pairs: [LR, RL]
    real_sim_time_origin: not_shared
    exact_trajectory: unavailable_for_real_evk4
  ours_input: HDR/radiance + depth + segmentation + physical state + timestamps
  v2e_input: image sequence rendered from the same Genesis replay
  v2e_input_must_not_be: a different motion trajectory or a different crop

evaluation_windows:
  mode: fixed_equal_duration
  duration_s: 0.005
  selection: deterministic_normalized_fractions
  normalized_fractions: [0.25, 0.50, 0.75]
  same_window_for_all_methods: true
  method_specific_window_selection: false
  time_offset_search: false
  reason: >-
    5 ms is the pre-registered accumulation interval retained from v1. It is
    short relative to each one-round motion duration and long enough to avoid
    defining a zero-event window by a single timestamp sample. The value is
    fixed without inspecting formal outputs.
  short_sequence_fallback: >-
    If a sequence is shorter than three non-overlapping windows, use the three
    deterministic normalized centers with the same 5 ms duration and record
    their exact timestamps; never change duration or optimize offsets.
  temporal_alignment: none
  temporal_per_bin_metric: disabled

metrics:
  primary:
    - event_rate_relative_error
    - polarity_ratio_error
    - active_pixel_ratio_error
    - spatial_distribution_l1_8x8
  definitions:
    event_rate_relative_error: abs(rate_sim-rate_real)/max(rate_real, eps)
    polarity_ratio_error: abs(ON_ratio_sim-ON_ratio_real)
    active_pixel_ratio_error: abs(APR_sim-APR_real)
    spatial_distribution_l1_8x8: sum_i abs(p_sim_i-p_real_i), p_i=N_i/sum_j N_j
  normalization: rate_not_raw_count_when_duration_differs
  disabled:
    temporal_rate_error_per_5ms_bin: no auditable common temporal origin
    chamfer_distance_cd: no auditable spatial-temporal correspondence
    gaussian_distance_gd: no auditable spatial-temporal correspondence
    composite_score: forbidden
    ranking_score: forbidden
  uncertainty: descriptive_mean_std_only
  significance_claims: forbidden_for_current_n1_acquisition_family

reproducibility:
  seed: 42
  config_hashes: benchmark/configs/CONFIG_HASHES.json
  pair_manifest: benchmark/evaluation_pairs_v2.yaml
  output_root: benchmark/results
  preserve_json_csv: true
  missing_data: >-
    Mark affected values NA with a machine-readable reason; never impute or
    silently drop a sequence.

phase_boundary:
  formal_benchmark_executed: false
  allowed_in_phase_4_6:
    - protocol_and_manifest_validation
    - frozen_core_integrity_check
    - HDR_replay_and_Ours_short_smoke
    - V2E_cadence_numerical_smoke
    - event_schema_smoke
    - equal_duration_window_extractor_smoke
  prohibited_in_phase_4_6:
    - complete_evaluation_set_metrics
    - baseline_parameter_search
    - Ours_parameter_change
    - formal_ranking
    - using_display_rgb_as_HDR_formal_input
  final_confirmation_required_for:
    - formal benchmark execution
    - any baseline parameter change
    - any Ours parameter change
