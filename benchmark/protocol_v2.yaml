protocol_id: quality_benchmark_v2
protocol_version: v2-frozen
status: frozen_before_formal_execution
formal_run_allowed: false
protocol_hash:
  algorithm: sha256
  value: recorded_in_benchmark/protocol_v2.sha256
  scope: exact_bytes_of_this_file
supersedes:
  file: benchmark/protocol_v1.yaml
  sha256: b1b4519446bbc821220b3502a0eb3811bf8c0baf8bd457eca022a0d082ebdd97

frozen_repository:
  repository: zyh2308/genesis-event-camera-plugin
  frozen_core_commit: e79e656ac00f7847b98db9e12bf43b093f3afff1
  frozen_core_subject: "Fix v3 correspondence and visibility semantics"
  benchmark_head_policy: >-
    The benchmark harness and protocol may be committed after the frozen core
    commit. The genesis_event_plugin/ tree must remain byte-for-byte equivalent
    to the frozen core reference; an exact core diff is a stop condition.
  core_modification_during_benchmark: forbidden
  core_integrity_check: "git diff --exit-code e79e656 -- genesis_event_plugin/"

scientific_question: >-
  Evaluate whether the frozen v3.1 simulator generates event streams that are
  consistent with real EVK4 recordings and whether it is competitive on
  pre-defined, physically interpretable distributional metrics. This is a
  fixed-configuration system-level simulator comparison, not a claim of exact
  EVK4 circuit reproduction, PECS-rig reproduction, or isolated pixel-model
  superiority.

pre_result_change_record:
  created_before_formal_result: true
  reason_for_v2:
    - The v1 formal execution gate was intentionally never enabled.
    - The benchmark HEAD must be allowed to advance after the frozen core.
    - V2E formal input cadence was not defined in v1.
    - Formal real/simulation pair definitions were not explicit in v1.
    - Equal-duration evaluation windows were not strict in v1.
  result_independent: true
  forbidden_basis: >-
    No Ours or V2E formal metric, ranking, or visual result was inspected or
    used to create this protocol version.

execution_gate:
  approval_file: benchmark/FORMAL_RUN_APPROVAL.yaml
  approval_required: true
  approval_scope: preparation_only_until_final_confirmation
  required_clean_worktree: true
  required_protocol_hash: benchmark/protocol_v2.sha256
  required_pair_manifest_hash: benchmark/evaluation_pairs_v2.sha256
  runner_cli_overrides_forbidden:
    - metrics
    - windows
    - params
    - methods
    - seed
    - cadence
  formal_result_creation: disabled_until_separate_final_confirmation

data_policy:
  existing_assets_first: true
  fabricate_data: false
  test_specific_tuning: false
  composite_score: false
  simulator_ranking: false
  raw_data_outside_repository: true
  external_asset_root: /home/科研/Eventbased_WAM
  parameter_search_after_freeze: forbidden

real_data:
  calibration:
    id: evk4_static_noise_reference_20260912
    role: fixed_real_v2_reference_only
    source_root: /root/eventcamera_lab_staging/decoded
    recordings:
      - 20260912_r2_dark/dark_01
      - 20260912_r2_dark/dark_02
      - 20260912_r2_dark/dark_03
      - 20260912_r2_white_wall/white_01
      - 20260912_r2_white_wall/white_02
      - 20260912_r2_white_wall/white_03
    resolution: [1280, 720]
    use_for_dynamic_parameter_tuning: false
  dynamic:
    - id: evk4_checkerboard_translation_one_round_20260914
      role: directional_real_reference
      sources:
        LR: /home/科研/Eventbased_WAM/data/real/evk4_checkerboard_translation_20260914/derived/one_round_h5/segment_01_LR.hdf5
        RL: /home/科研/Eventbased_WAM/data/real/evk4_checkerboard_translation_20260914/derived/one_round_h5/segment_02_RL.hdf5
      resolution: [1280, 720]
      duration_s:
        LR: 1.756258
        RL: 1.775800
      event_schema: "EVT3 HDF5 CD/events {x,y,p,t}; t in microseconds"
      trajectory_status: exact_x_of_t_unavailable
