# EventGenesis experiment contract v1.
# Formal experiments must use this file (or an explicitly versioned copy) and
# record its SHA-256 in metadata/metadata.json and manifest.json.
schema_version: eventgenesis-config-v1
core_commit: e79e656ac00f7847b98db9e12bf43b093f3afff1
genesis_version: "1.2.2"
seed: 42

sensor:
  resolution_xy: [1280, 720]
  preset: real_v2
  pos_thres: 0.205
  neg_thres: 0.195
  sigma_thres: 0.04
  cutoff_hz: 50.0
  leak_rate_hz: 0.0
  leak_jitter_fraction: 0.0
  shot_noise_rate_hz: 0.0
  shot_noise_inten_factor: 0.25
  depth_noise_scale: 0.0
  photoreceptor_noise: false
  noise_rate_cov_decades: 0.0
  refractory_period_s: 0.0
  hot_pixel_rate_hz: 0.0
  # null preserves the real_v2 preset's repository-resolved noise map.
  pixel_noise_map_path: null
  correlated_noise_alpha: 0.701838977169265
  correlated_noise_scale: 0.016
  seed: 42
  readout_model: ideal_readout

radiometry:
  input_space: linear
  response_mode: physical_log
  radiance_scale: 1.0
  white_level: 1.0
  log_threshold: 20.0
  gain: 1.0
  offset: 0.0
  floor: 1.0e-6
  calibration_status: uncalibrated
  calibration_id: ""
  calibrated_transfer_path: null

reconstruction:
  source_dt_s: 0.01
  contrast_threshold: 0.2
  safety_factor: 0.5
  min_samples: 2
  max_samples: 300
  flow_percentile: 100.0
  max_boundary_motion_px: 1.0
  max_relative_depth_change: 0.1
  max_camera_motion_px: 1.0
  max_articulation_motion_px: 1.0
  radiance_residual_threshold: 0.1
  sensor_eps_target: 0.05
  max_disocclusion_fraction: 0.0
  visibility_guard: true
  strict_sampler: true
  disocclusion_policy: hold
  warp_composite: next_primary
  warp_backend: numpy
  strict_fidelity: false
  # Total over-render margin (horizontal, vertical); camera intrinsics and
  # Genesis camera resolution must be configured consistently by the caller.
  camera_margin_xy: [0, 0]

scene:
  resolution_xy: [1280, 720]
  camera_profile: evk4_hd
  camera_id: camera0
  object_ids: []
  robot_link_ids: []

output:
  timestamp_unit: s
  event_timestamp_unit: us
  event_layout: t,x,y,p_01
  output_rgb_frames: false
